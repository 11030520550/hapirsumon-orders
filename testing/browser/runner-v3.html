<pre id="out">RUNNING</pre>

"use strict";
const out = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById("f");
let w, d;
const $ = (s) => d.querySelector(s);
const $$ = (s) => [...d.querySelectorAll(s)];
const check = (name, cond, detail = "") => {
  out.push(`${cond ? "PASS" : "FAIL"} ${name}${detail ? " — " + detail : ""}`);
  // Live progress: if a run hangs, the dumped page shows the last finished check.
  document.getElementById("out").textContent = `RUNNING (${out.length})\n${out.join("\n")}`;
};
const text = (s) => ($(s)?.textContent || "").replace(/\s+/g, " ").trim();
const shown = (el) => !!el && el.offsetParent !== null;
const visible = (s) => { const el = $(s); return !!el && !el.hidden && w.getComputedStyle(el).display !== "none" && (el.offsetParent !== null || w.getComputedStyle(el).position === "fixed"); };
const page = () => $$("#app-shell .page-view[data-page]").filter((p) => !p.hidden).map((p) => p.dataset.page).join(",");
function setVal(el, value) { el.value = value; el.dispatchEvent(new w.Event("input", { bubbles: true })); el.dispatchEvent(new w.Event("change", { bubbles: true })); }
async function load(params, hash = "", width = 1280) {
  frame.style.width = width + "px";
  await new Promise((resolve) => { frame.onload = resolve; frame.src = `/__test/app.html?${params}&t=${Math.random()}${hash}`; });
  w = frame.contentWindow; d = w.document; await sleep(400);
}
async function login() {
  $('#login-form [name="email"]').value = "user@example.invalid";
  $('#login-form [name="password"]').value = "x";
  $("#login-form").requestSubmit(); await sleep(700);
}
const nav = async (view) => { $(`.main-nav [data-view="${view}"]`).click(); await sleep(150); };
const db = () => w.__mock.db;
async function waitFor(condition, timeout = 3000) {
  for (let waited = 0; waited < timeout; waited += 50) { if (condition()) return true; await sleep(50); }
  return false;
}
// Answers the system confirmation dialog (#app-confirm-modal). Returns false if the dialog is not open.
async function answerDialog({ reason = null, cancel = false } = {}) {
  // The dialog opens after any pending refresh/render; poll instead of a fixed wait (stable under load).
  let modal = null;
  for (let waited = 0; waited < 2000; waited += 50) {
    modal = $("#app-confirm-modal");
    if (modal && modal.open) break;
    await sleep(50);
  }
  if (!modal || !modal.open) return false;
  if (cancel) { modal.querySelector("[data-close-modal]").click(); await sleep(40); return true; }
  if (reason !== null) $("#app-confirm-reason").value = reason;
  $("#app-confirm-form").requestSubmit(); await sleep(40);
  return true;
}

  check("R5 no section / publication-date columns", !text('[data-page="orders"] thead').includes("מדור") && !text('[data-page="orders"] thead').includes("תאריך פרסום") && text('[data-page="orders"] thead').includes("גיליון"));

  $('[data-sheet-view="124"]').click(); await sleep(250);

  check("R11 sheet columns: product, credits, before/after VAT, status, notes", ["מוצר", "קרדיטים", "לפני מע", "כולל מע", "סטטוס תשלום", "הערות"].every((h) => text('[data-page="sheet"] thead').includes(h)));

  w.__mock.failTable("customer_packages", 1);
  await w.ModaatApp.refresh(); await sleep(500);
  check("I3 background refresh failure is visible in the status line", $(".storage-note").classList.contains("is-error") && text("#sync-status").includes("שגיאת סנכרון"), text("#sync-status"));
  check("I4 background refresh failure shows one toast", $("#toast").classList.contains("visible") && text("#toast").includes("רענון"), text("#toast"));
  await w.ModaatApp.refresh(); await sleep(500);
  check("I5 the error clears after a successful refresh", !$(".storage-note").classList.contains("is-error") && !text("#sync-status").includes("שגיאת"), text("#sync-status"));
  await nav("orders");
  const victim = db().orders.find((o) => o.payment_status === "pending" && $(`[data-delete-order="${o.id}"]`));
  const ordersBefore = db().orders.length;
  $(`[data-delete-order="${victim.id}"]`).click();
  const deleteAsked = await answerDialog({ cancel: true }); await sleep(300);

  // ===== Stage 4: sheets model v2 contract (the Mock mirrors supabase-sheets-v2*.sql)

  const sbc = w.ModaatApp.client();

  const overview = async () => (await sbc.from("sheet_overview").select("*")).data;
  const ov = (list, n) => list.find((r) => r.sheet_number === n);
  const addDaysT = (v, d) => { const [y, m, dd] = v.split("-").map(Number); return new Date(Date.UTC(y, m - 1, dd + d)).toISOString().slice(0, 10); };
  const jParts = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Jerusalem", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  const jLocal = (ms) => { const p = Object.fromEntries(jParts.formatToParts(new Date(ms)).map((x) => [x.type, x.value])); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; };
  const serverMsNow = () => Date.parse(w.__mock.serverNow());
  let sv = await overview();
