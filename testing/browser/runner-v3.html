const frame = document.getElementById("f");
let w, d;
const $ = (s) => d.querySelector(s);

const check = (name, cond, detail = "") => {
  out.push(`${cond ? "PASS" : "FAIL"} ${name}${detail ? " — " + detail : ""}`);
  // Live progress: if a run hangs, the dumped page shows the last finished check.
  document.getElementById("out").textContent = `RUNNING (${out.length})\n${out.join("\n")}`;
};
const text = (s) => ($(s)?.textContent || "").replace(/\s+/g, " ").trim();
const shown = (el) => !!el && el.offsetParent !== null;
const visible = (s) => { const el = $(s); return !!el && !el.hidden && w.getComputedStyle(el).display !== "none" && (el.offsetParent !== null || w.getComputedStyle(el).position === "fixed"); };
const page = () => $$("#app-shell .page-view[data-page]").filter((p) => !p.hidden).map((p) => p.dataset.page).join(",");
function setVal(el, value) { el.value = value; el.dispatchEvent(new w.Event("input", { bubbles: true })); el.dispatchEvent(new w.Event("change", { bubbles: true })); }
async function load(params, hash = "", width = 1280) {
  frame.style.width = width + "px";
  await new Promise((resolve) => { frame.onload = resolve; frame.src = `/__test/app.html?${params}&t=${Math.random()}${hash}`; });
  w = frame.contentWindow; d = w.document; await sleep(400);
}
async function login() {
  $('#login-form [name="email"]').value = "user@example.invalid";
  $('#login-form [name="password"]').value = "x";
  $("#login-form").requestSubmit(); await sleep(700);
}
const nav = async (view) => { $(`.main-nav [data-view="${view}"]`).click(); await sleep(150); };
const db = () => w.__mock.db;
async function waitFor(condition, timeout = 3000) {
  for (let waited = 0; waited < timeout; waited += 50) { if (condition()) return true; await sleep(50); }
  return false;
}
// Answers the system confirmation dialog (#app-confirm-modal). Returns false if the dialog is not open.
async function answerDialog({ reason = null, cancel = false } = {}) {
  // The dialog opens after any pending refresh/render; poll instead of a fixed wait (stable under load).
  let modal = null;
  for (let waited = 0; waited < 2000; waited += 50) {
    modal = $("#app-confirm-modal");
    if (modal && modal.open) break;
    await sleep(50);
  }
  if (!modal || !modal.open) return false;
  if (cancel) { modal.querySelector("[data-close-modal]").click(); await sleep(40); return true; }
  if (reason !== null) $("#app-confirm-reason").value = reason;
  $("#app-confirm-form").requestSubmit(); await sleep(40);
  return true;
}
