  <dialog class="modal" id="biz-product-modal" aria-labelledby="biz-product-title">
    <form class="modal-card" id="biz-product-form">
      <div class="modal-heading">
        <div><span class="modal-kicker">קטלוג מוצרים</span><h2 id="biz-product-title">מוצר חדש</h2></div>
        <button class="close-button" type="button" data-close-modal aria-label="סגירה">×</button>
      </div>
      <label class="field-label">שם המוצר <span>*</span><input name="name" required maxlength="120" placeholder="לדוגמה: עמוד מלא"></label>
      <label class="field-label">מידות <span class="optional">(לא חובה)</span><input name="dimensions" maxlength="120" placeholder="לדוגמה: 25×35 ס״מ"></label>
      <div class="form-grid">
        <label class="field-label">מחיר לפני מע"מ (₪)<input name="price" type="number" min="0.01" max="99999999" step="0.01"></label>
        <label class="field-label">עלות בקרדיטים<input name="credits" type="number" min="0.01" max="999999" step="0.01"></label>
      </div>
      <label class="check-label"><input name="active" type="checkbox"> מוצר פעיל (זמין בהזמנה חדשה; מחייב מחיר ועלות קרדיטים)</label>
      <p class="form-message" id="biz-product-message" role="alert"></p>
      <div class="modal-actions"><button class="button button-outline" type="button" data-close-modal>ביטול</button><button class="button button-primary" type="submit" id="biz-product-submit">שמירת מוצר</button></div>
    </form>
  </dialog>
