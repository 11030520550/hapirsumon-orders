<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out">RUNNING</pre>
<iframe id="f" style="width:390px;height:800px"></iframe>
<script>
const f = document.getElementById("f"); const sleep = (ms) => new Promise((r) => setTimeout(r, ms)); const res = [];
function clipped(el, w) { for (let p = el.parentElement; p && p !== f.contentDocument.documentElement; p = p.parentElement) { const s = w.getComputedStyle(p); if (s.overflowX !== "visible") return true; } return false; }
async function probe(hash) {
  f.contentWindow.location.hash = hash; await sleep(600);
  const d = f.contentDocument, w = f.contentWindow, vw = w.innerWidth;
  const bad = [...d.body.querySelectorAll("*")].filter((el) => { const r = el.getBoundingClientRect(); return r.width > 0 && (r.left < -1 || r.right > vw + 1) && !clipped(el, w); })
    .slice(0, 8).map((el) => `${el.tagName}.${el.className}#${el.id} L=${Math.round(el.getBoundingClientRect().left)} W=${Math.round(el.getBoundingClientRect().width)} ovx=${w.getComputedStyle(el).overflowX}`);
  w.scrollTo(-5000, 0); const sx1 = w.scrollX; w.scrollTo(5000, 0); const sx2 = w.scrollX; w.scrollTo(0, 0); res.push(hash + " scrollX range=" + sx1 + ".." + sx2 + " bodySW=" + d.body.scrollWidth + " mainSW=" + d.querySelector(".main-content").scrollWidth + " sw=" + d.documentElement.scrollWidth + "\n  " + bad.join("\n  "));
}
f.onload = async () => { await sleep(900); await probe("#/new-order"); await probe("#/payments"); document.getElementById("out").textContent = res.join("\n") + "\nDONE"; };
f.src = "/__test/app.html?session=1&business=1";
</script></body></html>
